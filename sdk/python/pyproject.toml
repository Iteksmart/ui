[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itechsmart-prooflink"
version = "1.0.0"
description = "iTechSmart ProofLink SDK + `its` CLI — seal and verify cryptographic audit receipts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "iTechSmart Inc.", email = "djuane@itechsmart.dev" }]
keywords = ["prooflink", "audit", "receipts", "uaio", "itechsmart"]

[project.urls]
Homepage = "https://itechsmart.dev"
Verify = "https://verify.itechsmart.dev"

[project.scripts]
its = "itechsmart.cli:main"

[tool.setuptools.packages.find]
include = ["itechsmart*"]
